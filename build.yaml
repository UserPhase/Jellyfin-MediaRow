name: "Jellyfin Mediarow"
guid: "68cff731-4588-4ab3-aa0d-9ca73648679a"
version: "2.4.0"
targetAbi: "12.0.0.0"
framework: "net10.0"
owner: "UserPhase"
overview: "Netflix-style Home screen rows for Jellyfin"
description: >
  Turns the Jellyfin home screen into a Netflix-style streaming page with
  Popular and genre rows from Stremio catalogs. Browse and stream movies,
  series and anime with native AIOStreams playback, without importing the
  catalog. Fork of pythcon/jellyfin-dynamic-library.
category: "Metadata"
artifacts:
  - "Jellyfin.Plugin.Mediarow.dll"
changelog: |-
  ## 2.4.0
  - Retain unsaved-title cleanup with a custom grace period and Favorite-based retention
  - Keep watched movie identities after temporary library entries are removed
  - Organize all active settings for Jellyfin Web and Jellyfin Media Player
  - Keep catalog editing, per-user language preferences, library paths and diagnostics together
  - Add discovery catalogs, personal Home preferences, episode sync and stream recovery
  - Require authenticated, authorized stream redirects and keep private URLs out of logs
  - Preserve active relay tickets during cache cleanup and recover indexed subtitle files
  - Apply parental policy changes on the next request
  - Fix Jellyfin showing an older version after updating (the DLL now carries the release version)
  - Per-user audio and subtitle languages, with remembered choices per series
  - Skip Intro / Skip Credits and a Netflix-style next-episode prompt
  - Faster opening of movies and episodes that are not in the library yet
  - Next Up resumes where you stopped instead of showing the pilot

  ## 2.2.0
  - Configure exact Movies, Series and Anime paths separately
  - Preserve legacy destinations and use explicit paths for playback and cleanup

  ## 2.1.0
  - Add opt-in cleanup for watched movies and fully watched ended series
  - Protect shared viewers, favorites, active playback and unrelated filesystem media

  ## 2.0.3
  - Display the server's playback-resolution error instead of a generic warning
  - Clarify required filesystem libraries for AIOStreams playback

  ## 2.0.2
  - Fix configuration loading in embedded browsers without replaceChildren
  - Fix Home script and stylesheet URLs when Jellyfin uses a Base URL
  - Clarify client-specific library fallback and missing Home row troubleshooting

  ## 2.0.1
  - Fix first-time plugin repository manifest publication
  - Package the plugin DLL and metadata at the ZIP root

  ## 2.0.0
  - Renamed to Jellyfin Mediarow
  - Jellyfin 12 / .NET 10 support
  - Hybrid Home with mixed movie and series rows, category tabs, and draggable carousels
  - Native AIOStreams playback with ordered, fully labelled versions, probing, and header/HLS relay
  - Faster Home loading: shared catalog fetches, startup row warm-up, and cached posters
  - Preserved dynamic search, metadata, playback, and persistence pipeline
